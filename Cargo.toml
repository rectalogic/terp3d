[package]
name = "terp3d"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["webgl2"]
webgl2 = ["bevy/webgl2"]
webgpu = ["bevy/webgpu"]
debug = ["bevy/debug", "dep:console_error_panic_hook"]

[dependencies]
base64 = "0.23.1"
bevy = { version = "0.20.0", features = ["pan_orbit_camera", "bevy_feathers", "serialize"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
yazi = "0.2.2"

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1.7", optional = true }

[profile.release]
opt-level = "s"

[patch.crates-io]
# Need af1e2a274509f2498201a2d4fea4c1574f8e4a89 25dbc40a0f07a4dad7ade82da188303e292d3862 159fa8d8e5e11ba0d40f55e39986992520635f4f
bevy = { git = "https://github.com/rectalogic/bevy.git", branch = "v0.20.1-backports" }
